<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>코딩알려주는 누나 1일차 과제</title>
  </head>
  <body>
    <div id="wrap">
      <div>
        <div>
          <h1>자기소개서</h1>
          <p>
            안녕하세요. 제 이름은 chozza입니다. 항상 누구에게나 쉽고 즐겁게
            강의를 듣는게 제 목표입니다.
          </p>
        </div>
        <div>
          <div>
            <h2>좋아하는 음식</h2>
            <ul>
              <li>치킨</li>
              <li>탕수육</li>
              <li>고구마피자</li>
            </ul>
          </div>
          <div>
            <h2>좋아하는 가수</h2>
            <img src="image/BlackPink.jpg" alt="블랙핑크" width="200px" />
            <div>BlackPink</div>
            <div>
              <a
                href="https://tickets.interpark.com/contents/notice/detail/9231"
                target="_black"
                >친구들 BlackPink 공연 보러가야지 -></a
              >
            </div>
          </div>
          <div>
            <h2>그냥가진 노래</h2>
            <audio src="audio/audio.mp3" controls></audio>
            <a
              href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/audio"
              target="_blank"
              >오디오 넣는법 보기</a
            >
          </div>
          <div>
            <h2>인적사항</h2>
            <table border="1">
              <tr>
                <th>질문</th>
                <th>답변</th>
              </tr>
              <tr>
                <td>사는 곳?</td>
                <td>찾아보셈</td>
              </tr>
              <tr>
                <td>나이?</td>
                <td>먹을만큼 먹었음</td>
              </tr>
            </table>
            <div>
              테이블 쓰는 방법을 모르겠다고..
              <u>그럼 검색해봐(클릭 되는 줄 알고 속았지!)</u>
            </div>
          </div>
        </div>
        <div></div>
      </div>
      <div>
        <h2>연락&문의</h2>
        <input type="text" placeholder="궁금한거 없죠?." />
        <button type="submit">보내줘</button>
      </div>
    </div>
  </body>
</html>
