<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="wrap">
      <header id="header">
        <div class="area"></div>
        <div class="navbar">
          <a href="#">Gmail</a>
          <a href="#">이미지</a>
          <span>민수</span>
        </div>
      </header>
      <!-- header -->
      <main id="main">
        <div class="logo">
          <img src="img/google.png" alt="구글이미지" />
        </div>
        <div class="input">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Google 검색 또는 URL 입력" />
          <a href="#">
            <i class="fa-solid fa-microphone"></i>
          </a>
        </div>
        <div class="link-button">
          <div class="button-wrap">
            <button>Google Search</button>
            <button>I'm feeling lucky</button>
          </div>
          <div class="language-wrap">
            Google offered in:
            <a href="#">한국어</a>
            <a href="#">Engilish</a>
            <a href="#">日本語</a>
            <a href="#">漢語</a>
          </div>
        </div>
      </main>
      <!-- main -->
      <footer id="footer">
        <div class="section">Korea</div>
        <div class="article">
          <div class="article1">
            <a href="#">About</a>
            <a href="#">Advertising</a>
            <a href="#">Business</a>
            <a href="#">How search works</a>
          </div>
          <div class="article2">
            <a href="#">Privacy</a>
            <a href="#">Term</a>
            <a href="#">Settings</a>
          </div>
        </div>
      </footer>
      <!-- footer -->
    </div>
    <!-- wrap -->
  </body>
</html>
